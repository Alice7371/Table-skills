name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Confirm PowerShell 7
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          $env:WEB_STAND_IN_PWSH = (Get-Process -Id $PID).Path
          "WEB_STAND_IN_PWSH=$env:WEB_STAND_IN_PWSH" >> $env:GITHUB_ENV
      - name: Web Stand-in regression
        run: node tests/web-stand-in.cjs
      - name: Project handoff regression
        run: python -B -X utf8 tests/test_project_handoff.py
